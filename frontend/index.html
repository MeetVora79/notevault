<!doctype html>
<html lang="en">

<head>
  <!-- Basic -->
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0F172A" />
  <meta name="robots" content="index, follow" />
  <meta name="author" content="Meet Vora" />

  <!-- Title & Description -->
  <title>NoteVault | AI-Powered Smart Notes & Productivity App</title>

  <meta name="description"
    content="NoteVault is an AI-powered note-taking app with smart titles, semantic search, AI chat with notes, markdown support, tagging, and secure cloud sync." />

  <meta name="keywords"
    content="AI Notes, Notes App, Smart Notes, Semantic Search, AI Chat, Markdown Notes, Productivity, MERN Stack, React, Node.js" />

  <!-- Canonical -->
  <link rel="canonical" href="https://notevault-pro.vercel.app" />

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
    rel="stylesheet">

  <!-- Open Graph -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="NoteVault | AI-Powered Smart Notes" />
  <meta property="og:description"
    content="Organize notes smarter with AI-generated titles, semantic search, AI chat, markdown editor, and secure cloud storage." />
  <meta property="og:image" content="https://your-domain.com/og-image.png" />
  <meta property="og:url" content="https://notevault-pro.vercel.app" />
  <meta property="og:site_name" content="NoteVault" />

  <!-- Twitter -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="NoteVault | AI-Powered Smart Notes" />
  <meta name="twitter:description" content="Write, organize, search, and chat with your notes using AI." />
  <meta name="twitter:image" content="https://your-domain.com/og-image.png" />

</head>

<body>
  <div id="root">
    <div style="
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #ffffff;
      font-family: sans-serif;
    ">
      <div style="
        width: 32px;
        height: 32px;
        border: 2px solid rgba(109, 94, 248, 0.3);
        border-top-color: #6D5EF8;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      "></div>
    </div>
  </div>
  <style>
    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }
  </style>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
